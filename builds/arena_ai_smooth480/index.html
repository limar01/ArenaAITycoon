function isBlocked(cx, cy) {
  if (cx < 0 || cx >= COLS || cy < 0 || cy >= ROWS) return true;
  const c = MAP[cy][cx];
  return c === 'W' || c === 'D' || c === 'T' || c === 'M' || c === 'O' || c === 'G' || c === 'R';

// ===== CONTINUOUS COLLISION (radius-based, catches furniture edges) =====
// Agents have radius ~7px; this check samples the ring so diagonal slides
// along furniture edges stay smooth instead of snagging on tile corners.
const AGENT_R = 7;
function solidAt(x, y, r) {
  r = r || AGENT_R;
  // sample 8 points around the circle
  for (let i = 0; i < 8; i++) {
    const ang = (i / 8) * Math.PI * 2;
    const sx = x + Math.cos(ang) * r;
    const sy = y + Math.sin(ang) * r;
    const cx = Math.floor(sx / TILE);
    const cy = Math.floor(sy / TILE);
    if (cx < 0 || cx >= COLS || cy < 0 || cy >= ROWS) return true;
    if (isBlocked(cx, cy)) return true;
  }
  // also check center
  const cx = Math.floor(x / TILE);
  const cy = Math.floor(y / TILE);
  if (cx < 0 || cx >= COLS || cy < 0 || cy >= ROWS) return true;
  if (isBlocked(cx, cy)) return true;
  return false;

// ===== A* PATHFINDING =====
function findPath(sx, sy, tx, ty) {
  const start = [Math.floor(sx/TILE), Math.floor(sy/TILE)];
  const goal = [Math.floor(tx/TILE), Math.floor(ty/TILE)];
  
  if (start[0] === goal[0] && start[1] === goal[1]) return [];
  if (isBlocked(goal[0], goal[1])) return null;
  
  const open = new Map();
  const came = new Map();
  const gScore = new Map();
  const fScore = new Map();
  
  const key = (x,y) => x + ',' + y;
  const h = (x,y) => Math.abs(x-goal[0]) + Math.abs(y-goal[1]);
  
  gScore.set(key(start[0],start[1]), 0);
  fScore.set(key(start[0],start[1]), h(start[0],start[1]));
  open.set(key(start[0],start[1]), start);
  
  const dirs = [[0,-1],[0,1],[-1,0],[1,0]];
  
  while (open.size > 0) {
    let best = null, bestF = Infinity;
    for (const [k, v] of open) {
      const f = fScore.get(k) || Infinity;
      if (f < bestF) { bestF = f; best = v; }
    }
    
    if (best[0] === goal[0] && best[1] === goal[1]) {
      const path = [];
      let cur = key(best[0],best[1]);
      while (came.has(cur)) {
        const [cx,cy] = cur.split(',').map(Number);
        path.unshift([(cx+0.5)*TILE, (cy+0.5)*TILE]);
        cur = came.get(cur);
      }
      return path;
    }
    
    open.delete(key(best[0],best[1]));
    
    for (const [dx,dy] of dirs) {
      const nx = best[0]+dx, ny = best[1]+dy;
      if (isBlocked(nx,ny)) continue;
      
      const nk = key(nx,ny);
      const tg = (gScore.get(key(best[0],best[1])) || 0) + 1;
      
      if (tg < (gScore.get(nk) || Infinity)) {
        came.set(nk, key(best[0],best[1]));
        gScore.set(nk, tg);
        fScore.set(nk, tg + h(nx,ny));
        if (!open.has(nk)) open.set(nk, [nx,ny]);
      }
    }
  }
  return null;
}

// ===== DELTA-TIME MOVEMENT =====
function moveAgent(a, dt) {
  if (a.path && a.pathIdx < a.path.length) {
    const [tx, ty] = a.path[a.pathIdx];
    const dx = tx - a.x, dy = ty - a.y;
    const dist = Math.hypot(dx, dy);
    
    if (dist < 2) {
      a.pathIdx++;
      if (a.pathIdx >= a.path.length) {
        a.path = null;
        a.pathIdx = 0;
        a.moving = false;
      }
    } else {
      const speed = 60 * speedMul;
      const step = speed * dt;
      const ratio = Math.min(step / dist, 1);
      
      // Compute proposed new position
      let nx = a.x + dx * ratio;
      let ny = a.y + dy * ratio;
      
      // Collision check: use solidAt() to detect walls/furniture
      // Try full move first, then axis-separated for wall-sliding
      if (!solidAt(nx, ny)) {
        a.x = nx; a.y = ny;
      } else if (!solidAt(nx, a.y)) {
        // Can move along X only (slide along Y-blocked wall)
        a.x = nx;
      } else if (!solidAt(a.x, ny)) {
        // Can move along Y only (slide along X-blocked wall)
        a.y = ny;
      } else {
        // Both axes blocked — stop and clear path so AI can re-route
        a.path = null;
        a.pathIdx = 0;
        a.moving = false;
        return;
      }
      
      a.moving = true;
      
      if (Math.abs(dx) > Math.abs(dy)) {
        a.facing = dx > 0 ? 'right' : 'left';
      } else {
        a.facing = dy > 0 ? 'down' : 'up';
      }
      
      a.walkPhase += dt * 12 * speedMul;
    }
  } else {
    a.moving = false;
  }
}

// ===== KANBAN AI =====
function updateKanbanAI(a, dt) {
  // If agent has a task, work on it
  if (a.currentTask) {
    a.taskProgress += dt * speedMul;
    
    // Update phrase based on task
    const pct = Math.min(100, Math.floor((a.taskProgress / a.currentTask.duration) * 100));
    a.phrase = `${a.currentTask.name} (${pct}%)`;
    
    // Task complete
    if (a.taskProgress >= a.currentTask.duration) {
      // Move from DOING to DONE
      const idx = KANBAN.doing.indexOf(a.currentTask);
      if (idx >= 0) {
        KANBAN.doing.splice(idx, 1);
        a.currentTask.endTime = simTime;
        KANBAN.done.push(a.currentTask);
        KANBAN.completed++;
      }
      
      // Update task phrase
      const compliments = ['Done! ✅', 'Ship it! 🚀', 'Nailed it! 💪', 'Clean work! ✨', 'AAA quality! 🏆'];
      a.phrase = compliments[Math.floor(Math.random()*compliments.length)] + ' ' + a.currentTask.name;
      a.currentTask = null;
      a.taskProgress = 0;
      
      // Promote from TODO to DOING if available
      promoteTasks();
      renderKanban();
    }
    return;
  }
  
  // If idle, try to pick a task from TODO
  if (!a.currentTask) {
    // Find a task in TODO that matches this agent's role
    let bestTask = null;
    let bestIdx = -1;
    
    for (let i = 0; i < KANBAN.todo.length; i++) {
      const task = KANBAN.todo[i];
      // Match by role
      if (task.roleKey === a.id || task.roleName === 'Any') {
        bestTask = task;
        bestIdx = i;
        break;
      }
    }
    
    // If no role-matched task, pick any unassigned
    if (!bestTask) {
      for (let i = 0; i < KANBAN.todo.length; i++) {
        if (!KANBAN.todo[i].assignee) {
          bestTask = KANBAN.todo[i];
          bestIdx = i;
          break;
        }
      }
    }
    
    if (bestTask) {
      // Claim task
      KANBAN.todo.splice(bestIdx, 1);
      bestTask.assignee = a.id;
      bestTask.startTime = simTime;
      a.currentTask = bestTask;
      a.taskProgress = 0;
      KANBAN.doing.push(bestTask);
      
      // Navigate to task zone
      const zone = ZONES[bestTask.zone];
      if (zone) {
        a.path = findPath(a.x, a.y, zone.x, zone.y);
        a.pathIdx = 0;
        if (a.path && a.path.length > 0) a.moving = true;
      }
      
      a.phrase = `Working: ${bestTask.name}`;
      renderKanban();
    } else {
      // No task — go to home zone and idle
      const zone = ZONES[a.zone];
      if (zone && !a.path) {
        a.path = findPath(a.x, a.y, zone.x, zone.y);
        a.pathIdx = 0;
      }
      a.phrase = "Waiting for tasks...";
    }
  }
}

function promoteTasks() {
  // Promote from BACKLOG to TODO if TODO is low
  while (KANBAN.todo.length < 6 && KANBAN.backlog.length > 0) {
    KANBAN.todo.push(KANBAN.backlog.shift());
  }
}

// ===== DRAW CHARACTER =====
function drawAgent(a) {
  const px = Math.floor(a.x), py = Math.floor(a.y);

  // Delta-time walk animation: smooth sinusoidal cycles
  // walkPhase advances in moveAgent() as: walkPhase += dt * 12 * speedMul
  const bob = a.moving ? Math.sin(a.walkPhase) * 2.0 : 0;
  // Legs: opposite phase to body bob, larger amplitude for visible stride
  const legSwing = a.moving ? Math.sin(a.walkPhase + Math.PI) * 4.0 : 0;
  // Arms: 90° phase offset from legs for natural arm-swing feel
  const armSwing = a.moving ? Math.sin(a.walkPhase + Math.PI / 2) * 2.5 : 0;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(px - 5, py - 1, 10, 3);

  // Legs — directional: side views alternate stride, front/back stride in place
  ctx.fillStyle = '#1a1a2a';
  if (a.facing === 'left') {
    // Left-walking: left leg forward when legSwing < 0, right leg forward when > 0
    ctx.fillRect(px - 4, py - 2 + legSwing * 0.3, 2, 5 - Math.abs(legSwing) * 0.08);
    ctx.fillRect(px + 0, py - 2 - legSwing * 0.3, 2, 5 - Math.abs(legSwing) * 0.08);
  } else if (a.facing === 'right') {
    ctx.fillRect(px - 2, py - 2 - legSwing * 0.3, 2, 5 - Math.abs(legSwing) * 0.08);
    ctx.fillRect(px + 2, py - 2 + legSwing * 0.3, 2, 5 - Math.abs(legSwing) * 0.08);
  } else if (a.facing === 'up') {
    // Walking away: legs move up/down alternately
    ctx.fillRect(px - 3, py - 4 + legSwing * 0.2, 2, 5);
    ctx.fillRect(px + 1, py - 4 - legSwing * 0.2, 2, 5);
  } else {
    // Walking toward viewer (down): legs stride forward/back
    ctx.fillRect(px - 3, py - 4 - legSwing * 0.2, 2, 5);
    ctx.fillRect(px + 1, py - 4 + legSwing * 0.2, 2, 5);
  }

  // Body — bob with slight ease via sin (smoother landing feel)
  ctx.fillStyle = a.color;
  ctx.fillRect(px - 4, py - 8 + bob, 8, 6);

  // Arms — phase-lagged swing relative to legs
  ctx.fillStyle = a.skin || '#f0c0a0';
  ctx.fillRect(px - 5, py - 7 + bob + armSwing, 2, 4);
  ctx.fillRect(px + 3, py - 7 + bob - armSwing, 2, 4);

  // Head — follows body bob
  ctx.fillStyle = a.skin || '#f0c0a0';
  ctx.fillRect(px - 3, py - 12 + bob, 6, 5);

  // Hair
  ctx.fillStyle = a.hair || '#2a1a0a';
  if (a.facing === 'up') {
    ctx.fillRect(px - 3, py - 13 + bob, 6, 2);
  } else {
    ctx.fillRect(px - 3, py - 13 + bob, 6, 3);
    ctx.fillRect(px - 4, py - 12 + bob, 1, 2);
    ctx.fillRect(px + 3, py - 12 + bob, 1, 2);
  }

  // Eyes — face movement direction, bob with head
  if (a.facing !== 'up') {
    ctx.fillStyle = '#fff';
    if (a.facing === 'left') {
      ctx.fillRect(px - 2, py - 10 + bob, 1, 1);
      ctx.fillRect(px - 1, py - 10 + bob, 1, 1);
    } else if (a.facing === 'right') {
      ctx.fillRect(px + 1, py - 10 + bob, 1, 1);
      ctx.fillRect(px + 2, py - 10 + bob, 1, 1);
    } else {
      ctx.fillRect(px - 2, py - 10 + bob, 1, 1);
      ctx.fillRect(px + 1, py - 10 + bob, 1, 1);
    }
  }
  
  // Task indicator (small dot above head if working)
  if (a.currentTask) {
    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(px-1, py-16+bob, 2, 2);
  }
  
  // Name tag
  ctx.fillStyle = '#fff';
  ctx.font = '8px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(a.name, px, py-14+bob);
}

// ===== DRAW OFFICE =====
function drawOffice() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, 640, 480);
  
  ctx.fillStyle = '#151524';
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if ((x+y) % 2 === 0) ctx.fillRect(x*TILE, y*TILE, TILE, TILE);
    }
  }
  
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const c = MAP[y][x];
      const px = x*TILE, py = y*TILE;
      
      if (c === 'W') {
        ctx.fillStyle = '#3d3d66';
        ctx.fillRect(px, py, TILE, TILE);
        ctx.fillStyle = '#5a5a88';
        ctx.fillRect(px, py, TILE, 2);
      } else if (c === 'D') {
        ctx.fillStyle = '#4a3a2a';
        ctx.fillRect(px+1, py+3, TILE-2, TILE-5);
        ctx.fillStyle = '#2a1a0a';
        ctx.fillRect(px+2, py+4, TILE-4, 2);
        ctx.fillStyle = '#2a2a4a';
        ctx.fillRect(px+3, py+1, TILE-6, 4);
        ctx.fillStyle = '#4a6aaa';
        ctx.fillRect(px+4, py+2, TILE-8, 2);
      } else if (c === 'T') {
        ctx.fillStyle = '#2a5a2a';
        ctx.fillRect(px, py, TILE, TILE);
        ctx.fillStyle = '#1a3a1a';
        ctx.fillRect(px+1, py+1, TILE-2, TILE-2);
        if ((x+y)%3===0) {
          ctx.fillStyle = '#ffcc00';
          ctx.beginPath();
          ctx.arc(px+5, py+5, 2, 0, Math.PI*2);
          ctx.fill();
        }
      } else if (c === 'M') {
        ctx.fillStyle = '#5a5a5a';
        ctx.fillRect(px+2, py+2, TILE-4, TILE-3);
        ctx.fillStyle = '#3a3a3a';
        ctx.fillRect(px+3, py+3, TILE-6, 3);
        ctx.fillStyle = '#aa4444';
        ctx.fillRect(px+5, py+7, TILE-10, 2);
      } else if (c === 'O') {
        ctx.fillStyle = '#4a2a4a';
        ctx.fillRect(px+1, py+2, TILE-2, TILE-3);
        ctx.fillStyle = '#3a1a3a';
        ctx.fillRect(px+2, py+3, TILE-4, 2);
      } else if (c === 'G') {
        ctx.fillStyle = '#2a2a5a';
        ctx.fillRect(px, py, TILE, TILE);
        ctx.fillStyle = '#4a4a8a';
        ctx.fillRect(px+2, py+2, TILE-4, TILE-4);
      } else if (c === 'R') {
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(px+1, py+1, TILE-2, TILE-2);
        ctx.fillStyle = '#00ff00';
        for (let i=0; i<3; i++) ctx.fillRect(px+3, py+3+i*3, 2, 1);
      }
    }
  }
  
  // Zone labels
  ctx.fillStyle = 'rgba(184,120,248,0.5)';
  ctx.font = '9px monospace';
  ctx.textAlign = 'left';
  for (const [k, z] of Object.entries(ZONES)) {
    ctx.fillText(z.label, z.x+3, z.y+12);
  }
}

// ===== KANBAN RENDER =====
function renderKanban() {
  document.getElementById('col-backlog').innerHTML = KANBAN.backlog.map(t => 
    `<div class="kanban-card"><span class="role-tag role-${t.roleKey||'any'}">${t.roleName}</span><div class="task-name">${t.name}</div><div class="assignee">⏱️${t.duration}s</div></div>`
  ).join('');
  
  document.getElementById('col-todo').innerHTML = KANBAN.todo.map(t => 
    `<div class="kanban-card"><span class="role-tag role-${t.roleKey||'any'}">${t.roleName}</span><div class="task-name">${t.name}</div><div class="assignee">⏱️${t.duration}s</div></div>`
  ).join('');
  
  document.getElementById('col-doing').innerHTML = KANBAN.doing.map(t => {
    const a = agents.find(ag => ag.id === t.assignee);
    const pct = a ? Math.min(100, Math.floor((a.taskProgress / t.duration) * 100)) : 0;
    return `<div class="kanban-card"><span class="role-tag role-${t.roleKey||'any'}">${t.roleName}</span><div class="task-name">${t.name}</div><div class="assignee">👤 ${a?a.name:'?'} • ${pct}%</div></div>`;
  }).join('');
  
  document.getElementById('col-done').innerHTML = KANBAN.done.slice(-10).map(t => 
    `<div class="kanban-card"><span class="role-tag role-${t.roleKey||'any'}">${t.roleName}</span><div class="task-name">✅ ${t.name}</div><div class="assignee">👤 ${ROLES[t.assignee]?.title||'?'}</div></div>`
  ).join('');
  
  document.getElementById('kanban-stats').innerHTML = `
    <span>📥 Backlog: ${KANBAN.backlog.length}</span>
    <span>📝 TODO: ${KANBAN.todo.length}</span>
    <span>🔄 Doing: ${KANBAN.doing.length}</span>
    <span>✅ Done: ${KANBAN.completed}/${KANBAN.total}</span>
  `;
}

function toggleKanban() {
  kanbanOpen = !kanbanOpen;
  document.getElementById('kanban').style.display = kanbanOpen ? 'block' : 'none';
  if (kanbanOpen) {
    startKanbanPolling();
    renderKanban();
  } else {
    stopKanbanPolling();
  }
}

// ===== GAME STATE =====
let simTime = 8 * 60;
let lastFrame = performance.now();

function updateClock() {
  const h = Math.floor(simTime / 60);
  const m = Math.floor(simTime % 60);
  document.getElementById('clock').textContent = h.toString().padStart(2,'0') + ':' + m.toString().padStart(2,'0');
}

function setSpeed(s) { speedMul = s; }
function togglePause() { paused = !paused; }

// ===== MAIN LOOP =====
function loop(now) {
  requestAnimationFrame(loop);
  
  const dt = Math.min((now - lastFrame) / 1000, 0.1);
  lastFrame = now;
  
  if (paused) return;
  
  simTime += dt * speedMul * 0.5;
  if (simTime >= 24*60) simTime = 0;
  
  for (const a of agents) {
    updateKanbanAI(a, dt);
    moveAgent(a, dt);
  }
  
  drawOffice();
  for (const a of agents) {
    drawAgent(a);
  }
  
  updateClock();
  
  if (showBubble) {
    document.getElementById('bubble').style.display = 'block';
    document.getElementById('bubble').textContent = showBubble;
  } else {
    document.getElementById('bubble').style.display = 'none';
  }
  
  // Kanban auto-refresh is handled by startKanbanPolling()/stopKanbanPolling() via toggleKanban()
  // (old simTime-based refresh removed — polling keeps overlay live)
}

// ===== CLICK =====
canvas.addEventListener('click', (e) => {
  if (kanbanOpen) return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const my = (e.clientY - rect.top) * (canvas.height / rect.height);
  
  let closest = null, minD = 50;
  for (const a of agents) {
    const d = Math.hypot(a.x - mx, a.y - my);
    if (d < minD) { minD = d; closest = a; }
  }
  
  if (closest) {
    const task = closest.currentTask;
    if (task) {
      const pct = Math.floor((closest.taskProgress / task.duration) * 100);
      showBubble = `${closest.name}: ${task.name} (${pct}%)`;
    } else {
      showBubble = `${closest.name} (${closest.title}): Waiting for task...`;
    }
    setTimeout(() => { showBubble = null; }, 3000);
  }
});

// ===== INIT =====
generateSprint();
promoteTasks();
renderKanban();
requestAnimationFrame(loop);
</script>
